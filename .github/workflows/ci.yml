name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Static checks (Biome, tsc, dependency-cruiser)
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

  database:
    runs-on: ubuntu-latest

    # The environment, declared once for every step. A step overrides only
    # where it genuinely differs, and says why. There is no .env in CI, so
    # everything src/config requires without a default is here. The E2E step
    # once carried a hand copy of the integration step's variables, dropped
    # LOG_LEVEL, and failed only in CI (Epic 3 retrospective, P1).
    env:
      # The application role, bound by RLS: what the suites and the app use.
      DATABASE_URL: postgres://watchdog_app:watchdog_app_test_password@localhost:5432/watchdog_test?sslmode=disable
      # The owner, a superuser here as in Compose. DBMate migrates with it,
      # and the boot-guard suite proves api and worker refuse to start as it.
      DBMATE_DATABASE_URL: postgres://watchdog_owner:watchdog_owner_test_password@localhost:5432/watchdog_test?sslmode=disable
      BETTER_AUTH_SECRET: test_secret_at_least_32_characters_long
      LOG_LEVEL: info
      NODE_ENV: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: watchdog_test
          POSTGRES_USER: watchdog_owner
          POSTGRES_PASSWORD: watchdog_owner_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchdog_owner -d watchdog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors db/init/001-create-watchdog-app.sh, which Compose runs on first
      # volume init. The grants migration needs the role to already exist.
      - name: Create the application role
        run: |
          psql "$DBMATE_DATABASE_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" <<'SQL'
          select format(
            'create role watchdog_app login password %L '
            || 'nosuperuser nocreatedb nocreaterole noinherit nobypassrls',
            :'app_password'
          )
          where not exists (select 1 from pg_roles where rolname = 'watchdog_app')
          \gexec
          SQL
        env:
          APP_PASSWORD: watchdog_app_test_password

      - name: Run migrations
        run: pnpm run db:migrate

      # Fails if Better Auth expects schema no committed migration provides,
      # which pins the better-auth version to the committed FK contract.
      # Differs: it introspects the schema, so it connects as the owner.
      - name: Better Auth schema drift check
        run: pnpm run auth:schema:check
        env:
          DATABASE_URL: ${{ env.DBMATE_DATABASE_URL }}

      # Connects as watchdog_app, never the owner. The suite asserts that role
      # is neither superuser nor BYPASSRLS, so pointing this at the owner URL
      # fails loudly instead of passing vacuously.
      - name: Integration tests (tenant isolation)
        run: pnpm run test:integration

      # The same role and database as the integration suite. Each scenario
      # builds its own organization through the API and removes it after, so
      # nothing here depends on the seed or on another scenario.
      - name: E2E (Cucumber)
        run: pnpm run test:e2e

      - name: Keep the E2E report when a scenario fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Booting the full Compose stack is a separate concern and
      # arrives with the integration suite.
      - name: Build the shared api/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: watchdog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Added per ROADMAP phase, as the things they verify come into existence:
  #   phase 5 - k6 smoke (`pnpm run test:k6:smoke`) against a booted api
  #   phase 6 - docker build validation for the shared api/worker image
  # Full target shape: docs/genesis/ARCHITECTURE.md section 9.
