name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Static checks (Biome, tsc, dependency-cruiser)
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: watchdog_test
          POSTGRES_USER: watchdog_owner
          POSTGRES_PASSWORD: watchdog_owner_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchdog_owner -d watchdog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mirrors db/init/001-create-watchdog-app.sh, which Compose runs on first
      # volume init. The grants migration needs the role to already exist.
      - name: Create the application role
        run: |
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" <<'SQL'
          select format(
            'create role watchdog_app login password %L '
            || 'nosuperuser nocreatedb nocreaterole noinherit nobypassrls',
            :'app_password'
          )
          where not exists (select 1 from pg_roles where rolname = 'watchdog_app')
          \gexec
          SQL
        env:
          OWNER_URL: postgres://watchdog_owner:watchdog_owner_test_password@localhost:5432/watchdog_test?sslmode=disable
          APP_PASSWORD: watchdog_app_test_password

      - name: Run migrations
        run: pnpm run db:migrate
        env:
          DBMATE_DATABASE_URL: postgres://watchdog_owner:watchdog_owner_test_password@localhost:5432/watchdog_test?sslmode=disable

      # Fails if Better Auth expects schema no committed migration provides,
      # which pins the better-auth version to the committed FK contract.
      - name: Better Auth schema drift check
        run: pnpm run auth:schema:check
        env:
          DATABASE_URL: postgres://watchdog_owner:watchdog_owner_test_password@localhost:5432/watchdog_test?sslmode=disable
          BETTER_AUTH_SECRET: test_secret_at_least_32_characters_long

      # Connects as watchdog_app, never the owner. The suite asserts that role
      # is neither superuser nor BYPASSRLS, so pointing this at the owner URL
      # fails loudly instead of passing vacuously.
      - name: Integration tests (tenant isolation)
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgres://watchdog_app:watchdog_app_test_password@localhost:5432/watchdog_test?sslmode=disable
          BETTER_AUTH_SECRET: test_secret_at_least_32_characters_long
          LOG_LEVEL: info
          NODE_ENV: test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only. Booting the full Compose stack is a separate concern and
      # arrives with the integration suite.
      - name: Build the shared api/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: watchdog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Added per ROADMAP phase, as the things they verify come into existence:
  #   phase 3 - Cucumber E2E against the Postgres service container
  #   phase 5 - k6 smoke (`pnpm run test:k6:smoke`) against a booted api
  #   phase 6 - docker build validation for the shared api/worker image
  # Full target shape: docs/genesis/ARCHITECTURE.md section 9.
